[package]
name = "fuel-station"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
iced = { version = "0.14", features = ["tokio", "markdown", "advanced", "canvas"] }
notify-rust = "4"
rfd = "0.17"
rmcp = { version = "3.5", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
